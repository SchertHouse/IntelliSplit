
name: Build macOS AU

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Audio Unit Universal
    runs-on: macos-15

    steps:
      - name: Checkout IntelliSplit
        uses: actions/checkout@v4
        with:
          path: IntelliSplit

      - name: Checkout iPlug2
        uses: actions/checkout@v4
        with:
          repository: iPlug2/iPlug2
          ref: 61c042e936d832b6c7d93c5dd8b7e09cf2518bb9
          path: iPlug2
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Xcode configuration
        shell: bash
        run: |
          set -e

          PROJECT="$GITHUB_WORKSPACE/IntelliSplit/projects/IntelliSplit-macOS.xcodeproj"

          echo "Xcode version:"
          xcodebuild -version

          echo "Available targets and schemes:"
          xcodebuild -project "$PROJECT" -list

          echo "Checking AU configuration:"
          grep -R "AU_API" \
            "$GITHUB_WORKSPACE/IntelliSplit/config" || true

      - name: Build AU Release Universal
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/IntelliSplit"

          xcodebuild \
            -project projects/IntelliSplit-macOS.xcodeproj \
            -target AU \
            -configuration Release \
            -sdk macosx \
            SYMROOT="$GITHUB_WORKSPACE/build-mac-au" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package AU
        shell: bash
        run: |
          set -e
      
          AU_PATH="$HOME/Library/Audio/Plug-Ins/Components/IntelliSplit.component"
          DIST_DIR="$GITHUB_WORKSPACE/dist-au"
      
          if [ ! -d "$AU_PATH" ]; then
            echo "ERROR: AU bundle not found at $AU_PATH"
            find "$HOME/Library/Audio/Plug-Ins" -name "*.component" -print
            exit 1
          fi
      
          echo "Found AU: $AU_PATH"
      
          mkdir -p "$DIST_DIR"
      
          ditto "$AU_PATH" "$DIST_DIR/IntelliSplit.component"
      
          ditto -c -k --sequesterRsrc --keepParent \
            "$DIST_DIR/IntelliSplit.component" \
            "$GITHUB_WORKSPACE/IntelliSplit-macOS-AU.zip"
      
          echo "Package created:"
          ls -lh "$GITHUB_WORKSPACE/IntelliSplit-macOS-AU.zip"


      - name: Upload AU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelliSplit-macOS-AU
          path: IntelliSplit-macOS-AU.zip
          if-no-files-found: error
          retention-days: 30
