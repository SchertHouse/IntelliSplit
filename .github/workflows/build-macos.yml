
name: Build macOS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build VST3 macOS
    runs-on: macos-15

    steps:
      - name: Checkout IntelliSplit
        uses: actions/checkout@v4
        with:
          path: IntelliSplit

      - name: Checkout iPlug2
        uses: actions/checkout@v4
        with:
          repository: iPlug2/iPlug2
          path: iPlug2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download iPlug2 SDKs
        working-directory: iPlug2/Dependencies/IPlug
        run: |
          chmod +x download-iplug-sdks.sh
          ./download-iplug-sdks.sh

      - name: Verify VST3 SDK
        run: |
          SDK_PATH="$GITHUB_WORKSPACE/iPlug2/Dependencies/IPlug/VST3_SDK"

          test -f "$SDK_PATH/public.sdk/source/vst/vstrepresentation.cpp"
          test -f "$SDK_PATH/public.sdk/source/vst/vstsinglecomponenteffect.cpp"
          test -f "$SDK_PATH/public.sdk/source/vst/vstpresetfile.cpp"
          test -f "$SDK_PATH/public.sdk/source/vst/vstparameters.cpp"

          echo "VST3 SDK correctly installed"

      - name: Build VST3 Universal
        working-directory: IntelliSplit
        run: |
          xcodebuild \
            -project projects/IntelliSplit-macOS.xcodeproj \
            -target VST3 \
            -configuration Release \
            -sdk macosx \
            SYMROOT="$GITHUB_WORKSPACE/build-mac" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelliSplit-macOS-VST3
          path: build-mac/Release/
          if-no-files-found: error
