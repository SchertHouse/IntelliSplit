
name: Build macOS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VST3 macOS
    runs-on: macos-15

    steps:
      - name: Checkout IntelliSplit
        uses: actions/checkout@v4
        with:
          path: IntelliSplit

      - name: Checkout iPlug2
        uses: actions/checkout@v4
        with:
          repository: iPlug2/iPlug2
          ref: 61c042e936d832b6c7d93c5dd8b7e09cf2518bb9
          path: iPlug2

      - name: Verify iPlug2 revision
        run: |
          EXPECTED="61c042e936d832b6c7d93c5dd8b7e09cf2518bb9"
          ACTUAL=$(git -C iPlug2 rev-parse HEAD)

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download iPlug2 SDKs
        working-directory: iPlug2/Dependencies/IPlug
        run: |
          chmod +x download-iplug-sdks.sh
          ./download-iplug-sdks.sh

      - name: Verify VST3 SDK
        run: |
          SDK_PATH="$GITHUB_WORKSPACE/iPlug2/Dependencies/IPlug/VST3_SDK"

          test -f "$SDK_PATH/public.sdk/source/vst/vstrepresentation.cpp"
          test -f "$SDK_PATH/public.sdk/source/vst/vstsinglecomponenteffect.cpp"
          test -f "$SDK_PATH/public.sdk/source/vst/vstpresetfile.cpp"
          test -f "$SDK_PATH/public.sdk/source/vst/vstparameters.cpp"

          echo "VST3 SDK correctly installed"

      - name: Verify macOS build paths
        working-directory: IntelliSplit
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          echo "SRCROOT=$(pwd)"
          echo "iPlug2=$(realpath ../iPlug2)"
          echo "iPlug2 exists:"
          test -f ../iPlug2/IPlug/IPlug_include_in_plug_hdr.h
      
          echo "Project settings:"
          xcodebuild \
            -project projects/IntelliSplit-macOS.xcodeproj \
            -target VST3 \
            -configuration Release \
            -sdk macosx \
            -showBuildSettings | grep -E \
            '(^| )(SRCROOT|PROJECT_DIR|CONFIGURATION_BUILD_DIR|HEADER_SEARCH_PATHS|USER_HEADER_SEARCH_PATHS|GCC_PREFIX_HEADER) ='

      - name: Diagnose iPlug2 dependencies
        shell: bash
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Current directory: $(pwd)"
      
          for path in \
            iPlug2/IPlug/IPlugOBJCPrefix.pch \
            iPlug2/Dependencies/Build/mac/include \
            iPlug2/Dependencies/IPlug/VST3_SDK
          do
            if [ -e "$path" ]; then
              echo "[OK] $path"
            else
              echo "[MISSING] $path"
            fi
          done
      
          echo "iPlug2 contents:"
          ls -la iPlug2/
      
          echo "Dependencies contents:"
          ls -la iPlug2/Dependencies/
      
          echo "Submodules:"
          git submodule status
            
      - name: Build VST3 Universal
        working-directory: IntelliSplit
        run: |
          xcodebuild \
            -project projects/IntelliSplit-macOS.xcodeproj \
            -target VST3 \
            -configuration Release \
            -sdk macosx \
            SYMROOT="$GITHUB_WORKSPACE/build-mac" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelliSplit-macOS-VST3
          path: build-mac/Release/
          if-no-files-found: error
